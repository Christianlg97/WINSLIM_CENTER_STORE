[package]
name = "center-app"
version = "2.2.3"
description = "WinSlimCenter"
authors = ["you"]
edition = "2021"

[[bin]]
name = "WinSlimCenter"
path = "src/main.rs"

[lib]
name = "center_app_lib"
# `staticlib` and `cdylib` come from Tauri's template, which builds for phones
# too: Android loads the application as a shared library and iOS as a static
# one. On Windows the binary links the `rlib` and the other two are built for
# nobody — and the DLL is where the build's only warning came from, MSVC
# announcing the import library it had just created and rustc relaying it.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "fs", "time"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
dirs = "5"
# La Microsoft Store habla SOAP y publica las huellas de sus paquetes en base64.
quick-xml = "0.41"
sha2 = "0.10"
base64 = "0.22"
wildmatch = "2"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
