<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>WinSlimCenter UI Harness</title>
    <base href="/src/" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      // Un navegador con la pestaña oculta no dispara requestAnimationFrame, y
      // la tienda dibuja dentro de él: sin ventana visible no llega a pintarse
      // nunca. Con ?headless se sustituye por una microtarea —asíncrona, como
      // la de verdad, para que el guardia de re-render siga funcionando— y así
      // la interfaz se puede inspeccionar desde una comprobación automática.
      if (new URLSearchParams(location.search).has("headless")) {
        window.requestAnimationFrame = (callback) => {
          queueMicrotask(() => callback(performance.now()));
          return 1;
        };
      }
      const listeners = {};
      const msStoreTestParams = new URLSearchParams(location.search);
      const simulateNewerPackageError = msStoreTestParams.has("ms-newer-error");
      let mockTasks = [];
      const installTimers = new Map();
      // Productos de mentira para la sección de la Microsoft Store: iconos
      // locales, para que el banco de pruebas funcione sin red.
      const msStoreProducts = [
        { product_id: "9WZDNCRFJ3PZ", kind: "uwp", title: "Contoso Notes", description: "Un bloc de notas de ejemplo con sincronización simulada y temas claros y oscuros.", publisher: "Contoso Ltd.", icon_url: "/src/assets/catalog/notepad_plus_plus.svg", price: "Free", family: "Apps", package_families: ["Contoso.Notes_abc"] },
        { product_id: "9NBLGGH4NNS1", kind: "uwp", title: "Contoso Player", description: "Reproductor de vídeo de ejemplo con listas de reproducción.", publisher: "Contoso Ltd.", icon_url: "/src/assets/catalog/vlc.svg", price: "Free", family: "Apps", package_families: ["Contoso.Player_abc"] },
        // Descripción larga, en párrafos y con una lista de una línea por punto,
        // como las que devuelve la Microsoft Store de verdad.
        { product_id: "XPDC2RH70K22MN", kind: "win32", title: "Contoso Studio", description: "Editor clásico de ejemplo que se instala con su propio asistente.\r\n\r\nPensado para proyectos grandes: abre carpetas enteras, recuerda las pestañas de la última sesión y guarda copias automáticas mientras trabajas.\r\n\r\nNovedades de esta versión:\r\n• Búsqueda en todos los archivos del proyecto.\r\n• Temas claro y oscuro que siguen al sistema.\r\n• Atajos de teclado configurables.\r\n\r\nContoso Studio es gratuito para uso personal y educativo. Las empresas con más de cinco puestos necesitan una licencia comercial, que se puede adquirir desde la propia aplicación o en la web del fabricante.", publisher: "Contoso Labs", icon_url: "/src/assets/catalog/obsidian.svg", price: "Free", family: "Apps", package_families: [] },
      ];
      // Lo que este equipo de mentira tiene instalado de la tienda.
      let msStoreInstalled = [
        { family: "Contoso.Notes_abc", full_name: "Contoso.Notes_3.10.0_x64__abc", name: "Contoso.Notes", display_name: "Contoso Notes", version: "3.10.0", install_location: "C:\\Program Files\\WindowsApps\\Contoso.Notes_3.10.0_x64__abc", can_uninstall: true, launch_target: "shell:AppsFolder\\Contoso.Notes_abc!App" },
        { family: "Contoso.Legacy_xyz", full_name: "Contoso.Legacy_1.0.0_x64__xyz", name: "Contoso.Legacy", display_name: "Contoso Legacy", version: "1.0.0", install_location: "C:\\Program Files\\WindowsApps\\Contoso.Legacy_1.0.0_x64__xyz", can_uninstall: false, launch_target: null },
      ];
      // Navegadores de este equipo de mentira, para las aplicaciones web.
      // ?no-browsers simula un equipo sin ninguno y ?web-browser=RUTA uno que
      // ya tiene elegido el de la tienda.
      const harnessBrowsers = [
        { name: "Thorium", path: "C:\\Program Files\\Thorium\\Application\\thorium.exe", app_mode: true, windows_default: false },
        { name: "Mozilla Firefox", path: "C:\\Program Files\\Mozilla Firefox\\firefox.exe", app_mode: false, windows_default: false },
      ];
      let harnessWebBrowser = msStoreTestParams.get("web-browser") || null;
      const msStorePublished = {
        "Contoso.Notes_abc": msStoreTestParams.get("ms-published") || "3.14.2",
        "Contoso.Legacy_xyz": "1.0.0",
      };
      // El backend marca los resultados contra lo que Windows tiene puesto.
      const annotateInstalled = (products) => products.map((product) => {
        const family = (product.package_families || []).find((f) => msStoreInstalled.some((a) => a.family === f));
        const app = family && msStoreInstalled.find((a) => a.family === family);
        return app
          ? { ...product, installed: true, installed_family: app.family, installed_version: app.version, can_uninstall: app.can_uninstall }
          : { ...product, installed: false, installed_family: null, installed_version: null, can_uninstall: false };
      });
      const msStoreDetails = {
        "9WZDNCRFJ3PZ": {
          productId: "9WZDNCRFJ3PZ", title: "Contoso Notes", description: "Un bloc de notas de ejemplo con sincronización simulada y temas claros y oscuros.",
          version: "3.14.2", approximateSizeInBytes: 84 * 1024 * 1024, averageRating: 4.4, ratingCountFormatted: "12,3 K",
          packageLastUpdateDateUtc: "2026-07-19T10:22:00Z", subcategoryName: "Productividad",
          supportedLanguages: ["es-ES", "en-US", "fr-FR"],
          screenshots: [{ url: "/src/assets/winslim-center-logo.png" }, { url: "/src/assets/catalog/notepad_plus_plus.svg" }],
        },
      };
      function emitTasks() {
        listeners["downloads-changed"]?.({ payload: { tasks: mockTasks } });
      }
      async function catalog() {
        return fetch("/src-tauri/apps.json").then((response) => response.json());
      }
      // ?installed-update=steam da por instalada esa aplicación del catálogo con
      // una versión vieja, que es lo que hace falta para que aparezca en
      // «Actualizaciones» y se pueda pulsar su botón.
      // ?installed=id1,id2 las da por instaladas y al día, con versión «latest»
      // como las deja la tienda, que es el caso del distintivo «Ya instalado».
      function mockStatuses() {
        const statuses = {};
        for (const id of (msStoreTestParams.get("installed") || "").split(",").filter(Boolean)) {
          statuses[id] = {
            installed: true, version: "latest", origin: "center",
            install_path: "C:\\Apps\\" + id + "\\app.exe", install_location: "C:\\Apps\\" + id,
            update_available: false, latest_version: null, pending_restart: false,
            can_uninstall: true, can_launch: true,
          };
        }
        const appId = msStoreTestParams.get("installed-update");
        if (!appId) return statuses;
        return {
          ...statuses,
          [appId]: {
            installed: true,
            version: "1.0.0",
            origin: "center",
            install_path: "C:\\Apps\\" + appId + "\\app.exe",
            install_location: "C:\\Apps\\" + appId,
            update_available: true,
            latest_version: "2.0.0",
            pending_restart: false,
            can_uninstall: true,
            can_launch: true,
          },
        };
      }
      // Cuántas veces ha pedido cada cosa la interfaz. La tienda guarda la
      // referencia a `invoke` al cargar, así que envolverla desde fuera no
      // cuenta nada: el contador tiene que vivir aquí dentro. Sirve para
      // comprobar que una consulta que debe hacerse una sola vez —el estado de
      // Chocolatey, por ejemplo— no se dispara una vez por tecla.
      window.__harnessCalls = {};
      window.__harnessRequests = [];
      window.__TAURI__ = {
        core: {
          invoke: async (command, args = {}) => {
            window.__harnessCalls[command] = (window.__harnessCalls[command] || 0) + 1;
            window.__harnessRequests.push({ command, args });
            if (command === "portable_data_info") {
              return msStoreTestParams.has("portable") && args.appId === msStoreTestParams.get("installed-update")
                ? { directory: "C:\\Apps\\" + args.appId, backup_root: "C:\\Users\\Usuario\\AppData\\Local\\WinSlimCenter-Backups" }
                : null;
            }
            if (command === "open_portable_backups") return null;
            if (command === "web_browsers") {
              return msStoreTestParams.has("no-browsers")
                ? { browsers: [], selected: null }
                : { browsers: harnessBrowsers, selected: harnessWebBrowser };
            }
            if (command === "set_web_browser") {
              harnessWebBrowser = args.path;
              return null;
            }
            if (command === "uninstall_app") return "Aplicación desinstalada.";
            if (command === "check_connection") {
              window.__harnessConnectionChecks = (window.__harnessConnectionChecks || 0) + 1;
              return !msStoreTestParams.has("offline") || window.__harnessOnline === true ||
                (msStoreTestParams.has("retry-online") && window.__harnessConnectionChecks > 1);
            }
            if (command === "get_bootstrap") {
              const apps = await catalog();
              const statuses = mockStatuses();
              // ?pending simula el primer arranque, sin instantánea de la sesión
              // anterior: de lo que no instaló la tienda no se sabe nada hasta
              // que conteste el escaneo.
              const status_pending = msStoreTestParams.has("pending")
                ? apps.map((app) => app.id).filter((id) => !statuses[id])
                : [];
              return { catalog: apps, app_version: "0.1.3", installed: {}, statuses, status_pending, settings: { theme: "plata", accent: "#c7ced6" }, tasks: [] };
            }
            if (command === "reload_catalog") return catalog();
            if (command === "refresh_statuses" || command === "check_updates") {
              // ?scan-delay=MS y ?updates-delay=MS alargan cada paso, para ver la
              // tienda mientras el arranque comprueba el equipo por detrás.
              const delay = Number(msStoreTestParams.get(command === "refresh_statuses" ? "scan-delay" : "updates-delay") || 0);
              if (delay) await new Promise((resolve) => setTimeout(resolve, delay));
              return mockStatuses();
            }
            if (command === "get_tasks") return mockTasks;
            if (command === "get_templates") return [];
            if (command === "save_catalog") return "apps.test.json";
            if (command === "update_center_app") return "Actualización simulada correctamente";
            // ?store-update=2.9.0 hace que el repositorio publique esa versión; sin
            // el parámetro la tienda está al día, que es el caso corriente.
            // Las notas imitan las de una release real de la tienda: título con
            // almohadillas, una lista, un aviso y capturas alojadas en GitHub.
            // ?store-notes=none las quita, que es lo que pasa cuando sólo
            // respondió la API y no hubo feed que leer.
            if (command === "check_store_update") {
              await new Promise((resolve) => setTimeout(resolve, 500));
              const published = msStoreTestParams.get("store-update");
              if (!published) return null;
              const shot = "https://raw.githubusercontent.com/Christianlg97/WINSLIM_CENTER_STORE/main/src/assets/winslim-center-logo.png";
              const notes = msStoreTestParams.get("store-notes") === "none" ? null : {
                tag: "latest",
                title: "latest",
                html: `<h1>### WinSlimCenter ${published} ###</h1>
<ul><li>Las ventanas de actualización muestran las <strong>novedades</strong> de cada release.</li>
<li>El Bloc de notas de Windows ya no se confunde con <code>Notepad++</code>.</li></ul>
<div class="markdown-alert markdown-alert-warning"><p class="markdown-alert-title"><svg></svg>Warning</p><p>Cierra los juegos abiertos antes de actualizar.</p></div>
<a href="${shot}"><img src="${shot}" alt="image"></a>
<a href="${shot}"><img src="${shot}" alt="image"></a>
<p><a href="https://github.com/Christianlg97/WINSLIM_CENTER_STORE/commits/main">Todos los cambios</a></p>`,
                updated: "2026-10-11T09:00:00Z",
                url: "https://github.com/Christianlg97/WINSLIM_CENTER_STORE/releases/tag/latest",
              };
              return {
                version: published,
                current: "0.1.3",
                notes,
                release_page: "https://github.com/Christianlg97/WINSLIM_CENTER_STORE/releases/latest",
              };
            }
            // Las notas de una aplicación de GitHub. ?notes-fail simula que el
            // feed no responde y ?notes-delay=2000 que tarda.
            if (command === "get_release_notes") {
              await new Promise((resolve) => setTimeout(resolve, Number(msStoreTestParams.get("notes-delay") || 300)));
              if (msStoreTestParams.has("notes-fail")) throw "el feed no respondió";
              return {
                tag: args.tag || "v2.0.0",
                title: `Versión ${args.tag || "2.0.0"}`,
                html: "<h2>Novedades</h2><ul><li>Arranque más rápido.</li><li>Corrige el cierre al minimizar.</li></ul><script>window.__pwned = true<\/script><p onclick=\"window.__pwned = true\">Más detalles en <a href=\"javascript:window.__pwned=true\">este enlace</a>.</p>",
                updated: "2026-10-01T12:00:00Z",
                url: `https://github.com/${args.repo}/releases/tag/${args.tag || "v2.0.0"}`,
              };
            }
            if (command === "open_url") {
              window.__openedUrls = (window.__openedUrls || []).concat(args.url);
              return null;
            }
            // ?running=2 hace que la aplicación que se va a actualizar esté
            // abierta con ese número de procesos. ?running-packaged la declara
            // empaquetada, que es lo que añade «Instalar igualmente».
            if (command === "running_blocker" || command === "msstore_running_blocker") {
              const processes = Number(msStoreTestParams.get("running") || 0);
              if (!processes) return null;
              const name =
                command === "msstore_running_blocker"
                  ? msStoreInstalled.find((app) => app.family === args.family)?.display_name ||
                    args.family
                  : args.appId;
              return {
                name,
                processes,
                packaged:
                  command === "msstore_running_blocker" ||
                  msStoreTestParams.has("running-packaged"),
              };
            }
            // Como el backend: cuatro descargas a la vez y las demás esperando
            // turno en el orden en que se pidieron. Así una cola de varias
            // aplicaciones se ve avanzar igual que en la tienda de verdad.
            if (command === "install_app") {
              const appId = args.appEntry?.id;
              const name = args.appEntry?.name || appId;
              mockTasks = mockTasks
                .filter((task) => task.app_id !== appId)
                .concat({ app_id: appId, name, progress: 0, state: "queued", status: "En cola", can_pause: false, can_resume: false, can_cancel: true });
              emitTasks();
              const tick = setInterval(() => {
                const index = mockTasks.findIndex((task) => task.app_id === appId);
                if (index < 0) {
                  clearInterval(tick);
                  return;
                }
                if (index >= 4 || mockTasks[index].state === "cancelling") return;
                const task = mockTasks[index];
                const progress = Math.min(100, task.progress + 9 + Math.round(Math.random() * 9));
                const downloaded = progress >= 100;
                mockTasks[index] = {
                  ...task,
                  progress,
                  state: downloaded ? "installing" : "downloading",
                  status: downloaded ? "Instalando en segundo plano…" : `Descargando · ${progress}%`,
                };
                emitTasks();
                if (!downloaded) return;
                clearInterval(tick);
                installTimers.set(appId, setTimeout(() => {
                  installTimers.delete(appId);
                  mockTasks = mockTasks.filter((entry) => entry.app_id !== appId);
                  emitTasks();
                  listeners["install-finished"]?.({ payload: { ok: true, app_id: appId, changed: true, is_update: !!args.forceUpdate } });
                }, 900));
              }, 350);
              installTimers.set(appId, tick);
              return null;
            }
            if (command === "cancel_download") {
              const appId = args.appId;
              clearTimeout(installTimers.get(appId));
              installTimers.delete(appId);
              mockTasks = mockTasks.map((task) => task.app_id === appId
                ? { ...task, state: "cancelling", status: "Cancelando la instalación...", can_cancel: false }
                : task);
              emitTasks();
              setTimeout(() => {
                mockTasks = mockTasks.filter((task) => task.app_id !== appId);
                emitTasks();
                listeners["install-finished"]?.({ payload: { ok: false, app_id: appId, changed: false, is_update: false, cancelled: true, cancellation_kind: "installation", error: "Instalación cancelada por el usuario." } });
              }, 40);
              return null;
            }
            if (command === "msstore_options") {
              return {
                rings: [
                  { id: "Retail", label: "Retail (Base)" },
                  { id: "RP", label: "Release Preview" },
                  { id: "WIS", label: "Insider Slow" },
                  { id: "WIF", label: "Insider Fast" },
                ],
                default_ring: "Retail",
                host_arch: "x64",
              };
            }
            if (command === "msstore_search") {
              const query = String(args.query || "").trim();
              if (/^(9|xp)/i.test(query)) {
                const match = msStoreProducts.find((p) => p.product_id.toLowerCase() === query.toLowerCase()) || msStoreProducts[0];
                return { direct: true, products: annotateInstalled([match]) };
              }
              await new Promise((resolve) => setTimeout(resolve, 400));
              return {
                direct: false,
                products: annotateInstalled(msStoreProducts.filter((product) =>
                  `${product.title} ${product.publisher}`.toLowerCase().includes(query.toLowerCase())
                )),
              };
            }
            // Los otros dos repositorios. ?choco-installed declara que el
            // equipo ya tiene Chocolatey, que es lo que quita el aviso de que
            // la primera instalación lo traerá también.
            if (command === "choco_status") {
              await new Promise((resolve) => setTimeout(resolve, 100));
              const elevated = !msStoreTestParams.has("not-elevated");
              return msStoreTestParams.has("choco-installed")
                ? { available: true, version: "2.3.0", elevated }
                : { available: false, version: null, elevated };
            }
            if (command === "winget_search") {
              const query = String(args.query || "").toLowerCase();
              await new Promise((resolve) => setTimeout(resolve, 600));
              if (msStoreTestParams.has("winget-error")) throw "Windows Package Manager no está disponible.";
              return [
                { id: "7zip.7zip", name: "7-Zip", version: "26.02" },
                { id: "M2Team.NanaZip", name: "NanaZip", version: "6.5.1800.0" },
                { id: "mcmilk.7zip-zstd", name: "7-Zip ZS", version: "26.02-v1.5.7-R2" },
                { id: "ozone10.7zip.Dark", name: "Dark7zip", version: "26.02-0.70.0" },
                { id: "7zip.7zr", name: "7zr", version: "26.03" },
                { id: "QNapi.QNapi", name: "QNapi", version: "0.2.3" },
                { id: "Elcomsoft.ArchivePassword", name: "Advanced Archive Password Recovery", version: "4.66.266" },
              ].filter((p) => `${p.name} ${p.id}`.toLowerCase().includes(query));
            }
            if (command === "choco_search") {
              const query = String(args.query || "").toLowerCase();
              await new Promise((resolve) => setTimeout(resolve, 900));
              return [
                { id: "7zip", title: "7-Zip", version: "26.3.0", summary: "7-Zip is a file archiver with a high compression ratio.", author: "Igor Pavlov", icon_url: "/src/assets/catalog/seven_zip.svg", page_url: "https://community.chocolatey.org/packages/7zip", downloads: 35538182, approved: true },
                { id: "7zip.install", title: "7-Zip (Install)", version: "26.3.0", summary: "Instalador de 7-Zip que registra el programa en Windows.", author: "Igor Pavlov", icon_url: null, page_url: "https://community.chocolatey.org/packages/7zip.install", downloads: 21000000, approved: true },
                { id: "7zip.portable", title: "7-Zip (Portable)", version: "26.3.0", summary: "7-Zip sin instalador, para llevar en una unidad externa.", author: "Igor Pavlov", icon_url: null, page_url: "https://community.chocolatey.org/packages/7zip.portable", downloads: 3100000, approved: false },
              ].filter((p) => `${p.title} ${p.id}`.toLowerCase().includes(query));
            }
            if (command === "open_url") return null;
            if (command === "msstore_installed") {
              await new Promise((resolve) => setTimeout(resolve, 120));
              return msStoreInstalled.map((app) => ({ ...app }));
            }
            if (command === "msstore_check_updates") {
              const families = args.families || msStoreInstalled.map((a) => a.family);
              await new Promise((resolve) => setTimeout(resolve, 700));
              return families.map((family) => {
                const app = msStoreInstalled.find((a) => a.family === family);
                const latest = msStorePublished[family] || null;
                const product = msStoreProducts.find((p) => (p.package_families || []).includes(family));
                return {
                  family,
                  product_id: product?.product_id || null,
                  title: product?.title || null,
                  icon_url: product?.icon_url || null,
                  installed_version: app?.version || "",
                  latest_version: latest,
                  update_available: !!(app && latest && latest !== app.version),
                  error: product ? null : "La Microsoft Store no reconoce el paquete.",
                };
              });
            }
            if (command === "msstore_uninstall") {
              await new Promise((resolve) => setTimeout(resolve, 900));
              const app = msStoreInstalled.find((a) => a.family === args.family);
              if (!app) throw new Error("Windows ya no tiene registrada esa aplicación.");
              if (!app.can_uninstall) throw new Error(`Windows no permite quitar '${app.display_name}'.`);
              msStoreInstalled = msStoreInstalled.filter((a) => a.family !== args.family);
              return `${app.display_name} se desinstaló correctamente.`;
            }
            if (command === "msstore_launch") {
              const app = msStoreInstalled.find((a) => a.family === args.family);
              if (!app?.launch_target) throw new Error("No hay nada que abrir.");
              return "Aplicación abierta mediante Windows";
            }
            if (command === "msstore_details") {
              await new Promise((resolve) => setTimeout(resolve, 300));
              return msStoreDetails[args.productId] || {};
            }
            if (command === "msstore_install") {
              const taskId = `msstore:${String(args.productId).toUpperCase()}`;
              const name = args.name || taskId;
              let progress = 0;
              mockTasks = [{ app_id: taskId, name, progress, state: "downloading", status: "Consultando la Microsoft Store…", can_pause: true, can_resume: false, can_cancel: true, is_pausable: true }];
              emitTasks();
              const tick = setInterval(() => {
                progress += 12;
                const done = progress >= 100;
                mockTasks = [{ app_id: taskId, name, progress: Math.min(progress, 100), state: done ? "installing" : "downloading", status: done ? "Instalando paquete…" : `Descargando · ${Math.min(progress, 100)}%`, can_pause: !done, can_resume: false, can_cancel: true, is_pausable: !done }];
                emitTasks();
                if (!done) return;
                clearInterval(tick);
                installTimers.delete(taskId);
                setTimeout(() => {
                  mockTasks = [];
                  emitTasks();
                  if (simulateNewerPackageError) {
                    listeners["msstore-install-finished"]?.({
                      payload: {
                        ok: false,
                        product_id: args.productId,
                        name,
                        error:
                          "Windows rechazó el paquete: Error de implementación con HRESULT: 0x80073D06. " +
                          "No se pudo instalar el paquete porque ya hay instalada una versión superior.\n\n" +
                          "Windows no puede instalar Microsoft.UI.Xaml.2.8 porque ya está instalada " +
                          "la versión 8.2511.26001.0, que es superior.",
                      },
                    });
                    return;
                  }
                  // Windows registra el paquete: el equipo de mentira lo anota.
                  const product = msStoreProducts.find((p) => p.product_id.toLowerCase() === String(args.productId).toLowerCase());
                  for (const family of product?.package_families || []) {
                    const version = msStorePublished[family] || "1.0.0";
                    const existing = msStoreInstalled.find((a) => a.family === family);
                    if (existing) existing.version = version;
                    else msStoreInstalled.push({ family, full_name: `${family}_${version}`, name: family.split("_")[0], display_name: product.title, version, install_location: "", can_uninstall: true, launch_target: `shell:AppsFolder\\${family}!App` });
                  }
                  listeners["msstore-install-finished"]?.({ payload: { ok: true, product_id: args.productId, name, packages: 2 } });
                }, 600);
              }, 400);
              installTimers.set(taskId, tick);
              return taskId;
            }
            return null;
          },
        },
        event: {
          listen: async (name, handler) => {
            listeners[name] = handler;
            return () => delete listeners[name];
          },
        },
      };
    </script>
  </head>
  <body>
    <div class="boot-splash" id="boot-splash" role="status" aria-label="Iniciando WinSlimCenter">
      <div class="sync-logo-box" aria-hidden="true"><div class="sync-logo-ring"></div><div class="sync-logo-wrapper"><img src="/src/assets/winslim-center-logo.png" alt="" />
          <svg class="boot-offline-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m2 2 20 20M8.5 16.5a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5.05A16 16 0 0 1 22 8.82M5 12.55a11 11 0 0 1 5.17-2.39M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
            <circle cx="12" cy="20" r=".8" fill="currentColor" stroke="none" />
          </svg></div></div>
      <div class="boot-splash-copy" aria-hidden="true"><strong>WinSlimCenter</strong><span>Preparando la tienda…</span></div>
    </div>
    <script>
      // Preparar fuentes y logotipo antes de revelar el contenido evita cambios
      // de dibujo durante la entrada. El fondo coincide siempre con la ventana.
      const splash = document.getElementById("boot-splash");
      const logo = splash.querySelector("img");
      const logoLoaded = !logo || logo.complete ? null : new Promise((resolve) => {
        logo.addEventListener("load", resolve, { once: true });
        logo.addEventListener("error", resolve, { once: true });
      });
      const ready = Promise.all([
        logoLoaded,
        document.fonts?.load("700 28px Ubuntu"),
        document.fonts?.load("400 15px Ubuntu"),
      ]).catch(() => {});
      const pageLoaded = document.readyState === "complete" ? null : new Promise((resolve) => {
        window.addEventListener("load", resolve, { once: true });
      });
      window.__bootSplashShown = Promise.all([
        pageLoaded,
        Promise.race([ready, new Promise((resolve) => setTimeout(resolve, 400))]),
      ]).then(async () => {
        // Preparar las capas antes de abrir: el primer cambio de superficie de
        // WebView2 no debe ocurrir con la ventana ya en pantalla. Una ventana
        // oculta puede suspender rAF; el plazo evita bloquear su apertura.
        await Promise.race([
          new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve))),
          new Promise((resolve) => setTimeout(resolve, 150)),
        ]);
        if (window.__TAURI__?.core) {
          await window.__TAURI__.core.invoke("show_main_window").catch(() => {});
        }
        // Ya visible: pintar el fondo y arrancar juntos logo, aro y texto.
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        window.__bootSplashShownAt = performance.now();
        splash.classList.add("is-presented");
      });
    </script>
    <div id="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark"><img src="/src/assets/winslim-center-logo.png" alt="" /></span><span class="brand-name">WinSlimCenter</span><span class="brand-sub">App Store</span></div>
        <input id="search" class="search" type="text" placeholder="Buscar aplicaciones…" autocomplete="off" spellcheck="false" />
        <div class="top-actions">
          <button type="button" class="icon-btn" id="btn-refresh" title="Recargar aplicaciones y buscar actualizaciones"><span>↻</span> Refrescar</button>
          <button type="button" class="icon-btn" id="btn-update"><span>⬆</span> Actualizar tienda</button>
          <button type="button" class="about-btn" id="btn-about" aria-label="Acerca de WinSlimCenter">i</button>
        </div>
      </header>
      <div class="shell"><div class="loading-line" id="loading-line" aria-hidden="true"></div><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="scroll" id="content"></div></main></div>
      <footer class="status-bar">
        <div class="status-message" role="status" aria-live="polite">
          <span class="status-dot" id="status-dot" aria-hidden="true"></span>
          <div class="status-copy"><span class="status-label">ESTADO</span><span class="status-text" id="status-text">Listo</span></div>
          <span class="status-progress hidden" id="status-progress">0%</span>
          <span class="status-progress-track hidden" id="status-progress-track" aria-hidden="true"><span class="status-progress-fill" id="status-progress-fill"></span></span>
        </div>
        <div class="version-badge" title="Versión instalada de WinSlimCenter"><span class="version-product">WinSlimCenter</span><span class="version-number" id="app-version">v0.1.3</span></div>
      </footer>
    </div>
    <div class="modal-backdrop hidden" id="modal-backdrop"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
