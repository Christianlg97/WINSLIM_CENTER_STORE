<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WinSlimCenter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"><img src="assets/winslim-center-logo.png" alt="" /></span>
          <span class="brand-name">WinSlimCenter</span>
          <span class="brand-sub">App Store</span>
        </div>
        <input
          id="search"
          class="search"
          type="text"
          placeholder="Buscar aplicaciones…"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="top-actions">
          <button type="button" class="icon-btn" id="btn-refresh" title="Recargar aplicaciones y buscar actualizaciones">
            <svg class="btn-svg-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
              <path d="M16 16h5v5"/>
            </svg>
            Refrescar
          </button>
          <button type="button" class="about-btn" id="btn-about" title="Acerca de WinSlimCenter" aria-label="Acerca de WinSlimCenter">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9.25"/>
              <line x1="12" y1="11" x2="12" y2="16.25"/>
              <line x1="12" y1="7.75" x2="12" y2="7.75"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="shell">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main">
          <div class="scroll" id="content"></div>
        </main>
      </div>

      <footer class="status-bar">
        <div class="status-message" role="status" aria-live="polite">
          <span class="status-dot" id="status-dot" aria-hidden="true"></span>
          <div class="status-copy">
            <span class="status-label">ESTADO</span>
            <span class="status-text" id="status-text">Listo</span>
          </div>
          <span class="status-progress hidden" id="status-progress">0%</span>
          <span class="status-progress-track hidden" id="status-progress-track" aria-hidden="true">
            <span class="status-progress-fill" id="status-progress-fill"></span>
          </span>
        </div>
        <div class="version-badge" title="Versión instalada de WinSlimCenter">
          <span class="version-product">WinSlimCenter</span>
          <span class="version-number" id="app-version"></span>
        </div>
      </footer>
    </div>

    <div class="modal-backdrop hidden" id="modal-backdrop">
      <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
