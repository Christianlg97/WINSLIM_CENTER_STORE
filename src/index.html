<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>WinSlimCenter</title>
    <link rel="preload" href="assets/winslim-center-logo.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="preload" href="assets/fonts/ubuntu-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/ubuntu-medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/ubuntu-bold.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Antes que la hoja de estilos: el fondo de la tienda, para que la ventana
         no destelle en blanco mientras se carga. -->
    <style>html, body { background: #181818; }</style>
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Métricas internas de bajo coste. No pintan nada ni escriben durante el
      // arranque: main.js vuelca un único resumen cuando la tienda ya se ve.
      window.__frontendBootStartedAt ??= performance.now();
      window.__frontendMetrics ||= [];
      window.__recordFrontendMetric ||= (name, startedAt, detail = {}) => {
        const finishedAt = performance.now();
        window.__frontendMetrics.push({
          name,
          duration: Math.max(0, finishedAt - startedAt),
          at: finishedAt,
          detail,
        });
        if (window.__frontendMetrics.length > 180) window.__frontendMetrics.shift();
      };

      // El idioma del arranque se prepara en paralelo al logo y las fuentes.
      // Esta promesa existe antes de que pueda terminar cualquiera de ellos.
      window.__bootI18nReady = new Promise((resolve) => {
        window.__resolveBootI18n = resolve;
      });
    </script>
    <script type="module">
      import { cachedLanguagePreference, setLanguagePreference } from "./i18n.js";
      window.__i18nReady = setLanguagePreference(cachedLanguagePreference());
      window.__i18nReady.then(
        () => window.__resolveBootI18n?.(),
        () => window.__resolveBootI18n?.(),
      );
    </script>
  </head>
  <body>
    <!-- Lo primero que se ve mientras WebView carga el código y dibuja el
         catálogo. main.js lo desvanece en cuanto la tienda está pintada debajo. -->
    <div class="boot-splash" id="boot-splash" role="status" aria-label="Iniciando WinSlimCenter">
      <div class="sync-logo-box" aria-hidden="true">
        <div class="sync-logo-ring"></div>
        <div class="sync-logo-wrapper">
          <img src="assets/winslim-center-logo.png" width="904" height="904" alt="" fetchpriority="high" decoding="sync" />
          <svg class="boot-offline-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m2 2 20 20M8.5 16.5a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5.05A16 16 0 0 1 22 8.82M5 12.55a11 11 0 0 1 5.17-2.39M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
            <circle cx="12" cy="20" r=".8" fill="currentColor" stroke="none" />
          </svg>
        </div>
      </div>
      <div class="boot-splash-copy" aria-hidden="true">
        <strong>WinSlimCenter</strong>
        <span>Preparando la tienda…</span>
      </div>
    </div>
    <script>
      // Preparar fuentes y logotipo antes de revelar el contenido evita cambios
      // de dibujo durante la entrada. El fondo coincide siempre con la ventana.
      const splash = document.getElementById("boot-splash");
      const logo = splash.querySelector("img");
      const logoLoaded = !logo || logo.complete ? null : new Promise((resolve) => {
        logo.addEventListener("load", resolve, { once: true });
        logo.addEventListener("error", resolve, { once: true });
      });
      const ready = Promise.all([
        logoLoaded,
        document.fonts?.load("700 28px Ubuntu"),
        document.fonts?.load("400 15px Ubuntu"),
      ]).catch(() => {});
      window.__bootSplashShown = Promise.all([
        Promise.race([ready, new Promise((resolve) => setTimeout(resolve, 400))]),
        Promise.race([window.__bootI18nReady, new Promise((resolve) => setTimeout(resolve, 300))]),
      ]).then(async () => {
        // El idioma ya se preparo en paralelo con los recursos visuales.
        // La ventana oculta suele suspender rAF y agotaba siempre el plazo de
        // 150 ms. Forzar estilo y geometria prepara la misma capa sin esperar;
        // los dos fotogramas visibles que arrancan el fundido siguen debajo.
        splash.getBoundingClientRect();
        if (window.__TAURI__?.core) {
          await window.__TAURI__.core.invoke("show_main_window").catch(() => {});
        }
        // Ya visible: pintar el fondo y arrancar juntos logo, aro y texto.
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        window.__bootSplashShownAt = performance.now();
        splash.classList.add("is-presented");
      });
    </script>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"><img src="assets/winslim-center-logo.png" width="904" height="904" alt="" /></span>
          <span class="brand-name">WinSlimCenter</span>
          <span class="brand-sub">App Store</span>
        </div>
        <input
          id="search"
          class="search"
          type="text"
          placeholder="Buscar aplicaciones…"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="top-actions">
          <button type="button" class="icon-btn" id="btn-refresh" title="Recargar aplicaciones y buscar actualizaciones">
            <svg class="btn-svg-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
              <path d="M16 16h5v5"/>
            </svg>
            Refrescar
          </button>
          <button type="button" class="settings-btn" id="btn-settings" title="Configuración" aria-label="Configuración" aria-haspopup="dialog">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path class="settings-cog" d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle class="settings-hub" cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="shell">
        <div class="loading-line" id="loading-line" aria-hidden="true"></div>
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main">
          <div class="scroll" id="content"></div>
        </main>
      </div>

      <footer class="status-bar">
        <div class="status-message" role="status" aria-live="polite">
          <span class="status-dot" id="status-dot" aria-hidden="true"></span>
          <div class="status-copy">
            <span class="status-label">ESTADO</span>
            <span class="status-text" id="status-text">Listo</span>
          </div>
          <span class="status-progress hidden" id="status-progress">0%</span>
          <span class="status-progress-track hidden" id="status-progress-track" aria-hidden="true">
            <span class="status-progress-fill" id="status-progress-fill"></span>
          </span>
        </div>
        <div class="version-badge" title="Versión instalada de WinSlimCenter">
          <span class="version-product">WinSlimCenter</span>
          <span class="version-number" id="app-version"></span>
        </div>
      </footer>
    </div>

    <div class="modal-backdrop hidden" id="modal-backdrop">
      <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
